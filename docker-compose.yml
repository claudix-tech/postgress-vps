services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: ${CONTAINER_NAME:-postgres}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      # Loopback only by default. For public access set POSTGRES_BIND=0.0.0.0 (IPv4)
      # and/or POSTGRES_BIND6=:: (IPv6), and firewall the port. See README.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
      - "[${POSTGRES_BIND6:-::1}]:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep versioned data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION:-1000}
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: ${VOLUME_NAME:-postgres_data}
